title: "Ivan Krivokuca"
remote_theme: mmistakes/minimal-mistakes@4.28.1 # pinned: includes and Sass vars are overridden by name
favicon: /assets/images/favicon.ico

exclude:
    - CLAUDE.md
    - CV.*
    - Gemfile
    - Gemfile.lock
    - vendor
    - dist
    - test-results
    - node_modules

plugins:
    - jekyll-include-cache

sass:
    sass_dir: assets/css
    style: compressed

footer_scripts: # replaces MM's main.min.js (jQuery + GreedyNav)
    - /assets/js/site.js

footer:
    links:
        - label: "LinkedIn"
          icon: "fab fa-fw fa-linkedin-in"
          url: "https://www.linkedin.com/in/ivan-krivokuca/"
        - label: "GitHub"
          icon: "fab fa-fw fa-github"
          url: "https://github.com/Chatodo"
        - label: "Email"
          icon: "fas fa-fw fa-envelope-square"
          url: "m&#97;il&#116;o&#58;i&#118;an&#46;kr&#105;vokuca&#64;proton&#46;me"
