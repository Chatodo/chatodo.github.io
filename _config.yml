# Site settings
title: "Ivan Krivokuca"
baseurl: ""
github_username: Chatodo
minimal_mistakes_skin: air
minimal_mistakes_skin2: "dark"
repository: chatodo/chatodo.github.io

# Favicon
favicon: "/assets/images/favicon.ico"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Keep internal/dev files out of the published site
exclude:
    - CLAUDE.md
    - README.md
    - Gemfile
    - Gemfile.lock
    - vendor
    - .gitlab-ci-local
    - dist
    - test-results
    - node_modules

# Plugins
plugins:
    - jemoji
    - jekyll-include-cache

sass:
    sass_dir: assets/css

footer:
    links:
        - label: "LinkedIn"
          icon: "fab fa-fw fa-linkedin-in"
          url: "https://www.linkedin.com/in/ivan-krivokuca/"
        - label: "GitHub"
          icon: "fab fa-fw fa-github"
          url: "https://github.com/Chatodo"
        - label: "Email"
          icon: "fas fa-fw fa-envelope-square"
          url: "m&#97;il&#116;o&#58;i&#118;an&#46;kr&#105;vokuca&#64;proton&#46;me"
