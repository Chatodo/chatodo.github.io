- icon: fas fa-graduation-cap
  title: Master's Thesis - Hardware Security & Firmware Protection
  description: >-
      Surveyed low-level threats (UEFI bootkits, Rowhammer/Spectre, fault
      injection, DMA/JTAG, side channels) from x86/x64 to embedded ARM/RISC-V,
      compared hardware defenses (Secure Boot, TPM 2.0, TrustZone, RISC-V PMP,
      Secure Elements) with a critical look at TPM 2.0 (TPM-FAIL, CVE-2023-1017,
      bus interception, TOCTOU), and proposed a hybrid Secure Element + enclave
      architecture for constrained embedded systems.
  tags:
      [
          Hardware Security,
          Firmware Protection,
          TPM 2.0,
          TrustZone,
          Secure Elements,
      ]
  links:
      - { label: Read Full Research, url: /assets/files/memoire.pdf }

