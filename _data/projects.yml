- icon: fas fa-cubes
  title: Secure Microservices on Kubernetes
  description: >-
      Deployed a 3-tier application (Nginx, Flask, MySQL) meshed with Istio -
      HTTP/HTTPS gateway, URI-based VirtualService routing, persistent volume -
      and secured the cluster: strict mTLS between services, HTTPS ingress,
      least-privilege RBAC, Kubernetes secrets with no hard-coded credentials,
      hardened images (Docker Scout), Kiali validation.
  tags: [Kubernetes, Istio, mTLS, RBAC, Docker Scout]
  links:
      - {
            label: View on GitHub,
            url: https://github.com/Chatodo/kubernetes-projet,
            icon: fab fa-github,
        }

