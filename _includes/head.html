<meta charset="utf-8" />
<title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="{{ site.favicon | relative_url }}" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

{%- comment -%} Restore an explicit theme choice before the stylesheet applies
{%- endcomment -%}
<script>
    (function () {
        try {
            var theme = localStorage.getItem("theme");
            if (theme === "dark" || theme === "light") {
                document.documentElement.setAttribute("data-theme", theme);
            }
        } catch (e) {}
    })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
/>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

{%- comment -%} FontAwesome off the render path {%- endcomment -%}
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link
    rel="preload"
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css"
    as="style"
    onload="
        this.onload = null;
        this.rel = 'stylesheet';
    "
/>
<noscript
    ><link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css"
/></noscript>
